services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: quanlydetai
      MYSQL_USER: ${DB_USERNAME:-quanlydetai}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--log-bin-trust-function-creators=1"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./projects/Database/01_schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./projects/Database/02_logic_mysql.sql:/docker-entrypoint-initdb.d/02_logic.sql:ro
      - ./projects/Database/03_views_seed_mysql.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      - ./projects/Database/04_workflow_mysql.sql:/docker-entrypoint-initdb.d/04_workflow.sql:ro
      - ./projects/Database/05_department_catalog_mysql.sql:/docker-entrypoint-initdb.d/05_department_catalog.sql:ro
      - ./projects/Database/06_rubric_email_groups.sql:/docker-entrypoint-initdb.d/06_rubric_email_groups.sql:ro
      - ./projects/Database/07_department_review.sql:/docker-entrypoint-initdb.d/07_department_review.sql:ro
      - ./projects/Database/08_topic_review_deadline.sql:/docker-entrypoint-initdb.d/08_topic_review_deadline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER -D quanlydetai -e 'SELECT 1 FROM DANG_KY_DE_TAI LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    profiles: ["app"]
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/quanlydetai?serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:-quanlydetai}
      DB_PASSWORD: ${DB_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-bao-cao-de-tai}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /app/uploads
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-fit@example.test}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - report_data:/app/uploads
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  mysql_data:
  report_data:
