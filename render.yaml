services:
  - type: web
    name: quanlydetai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: bao-cao-de-tai
      - key: EMAIL_ENABLED
        value: "false"
      - key: EMAIL_BACKEND
        value: brevo
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
