spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:foundation;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${TEST_DDL_MODE:create-drop}
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
supabase.url=
supabase.key=
supabase.bucket=bao-cao-de-tai

spring.datasource.hikari.connection-init-sql=${TEST_DB_INIT_SQL:}

app.email.enabled=false

# MySQL integration tests: use TEST_DB_* overrides and TEST_DDL_MODE=validate.
# Import SQL 01-09 into schema quanlydetai on a separate test container/server.
# Never target the running application database. See docs/LOCAL_TEST.md.
