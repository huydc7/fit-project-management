<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
<title>Đề tài đã công bố</title>
</head>
<body>
<main>
<h1 class="page-title space-bottom">Đề tài đã công bố</h1>
<div th:replace="~{layout/search :: topicFilters(@{/student/topics})}"></div>
<div th:if="${thanhCong}" class="notice notice-success" role="status" th:text="${thanhCong}">
</div>
<div th:if="${loi}" class="notice notice-error" role="alert" th:text="${loi}">
</div>
<p class="muted">Chỉ nhóm trưởng được đăng ký. Đăng ký đang chờ duyệt sẽ giữ chỗ đề tài.</p>
<p class="muted" th:if="${#lists.isEmpty(topics)}">Chưa có đề tài được công bố.</p>
<article class="panel panel-body space-bottom" th:each="t : ${topics}">
<h2 class="item-title" th:text="${t.title}">
</h2>
<p class="muted" th:text="${t.period + ' · ' + t.department}">
</p>
<p class="pre-wrap" th:text="${t.content}">
</p>
<p>GVHD: <span th:text="${#strings.listJoin(t.supervisors, ', ')}">
</span>
</p>
<p class="warning-text" th:if="${t.held}">Đã có nhóm giữ chỗ / chờ duyệt.</p>
<p class="muted" th:unless="${t.open}">Ngoài thời gian đăng ký sinh viên.</p>
<form th:if="${t.open and !t.held}" th:action="@{/student/registrations}" method="post" class="inline-fields gap-sm">
<input type="hidden" name="topic" th:value="${t.id}">
<select name="group" required class="select-field" aria-label="Chọn nhóm">
<option value="">Chọn nhóm của bạn…</option>
<option th:each="g : ${groups}" th:if="${g.periodId == t.periodId}" th:value="${g.id}" th:text="${g.name + ' — ' + g.period}">
</option>
</select>
<button class="button button-primary no-wrap">Đăng ký chờ duyệt</button>
</form>
</article>
<div th:replace="~{layout/pagination :: pager(${topicsPage}, '/student/topics', 'page')}"></div>
</main>
</body>
</html>
