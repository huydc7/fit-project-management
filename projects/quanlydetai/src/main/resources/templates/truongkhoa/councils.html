<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
<title>Hội đồng phản biện</title>
</head>
<body>
<main>
<h1 class="page-title space-bottom">Hội đồng phản biện</h1>
<div th:if="${thanhCong}" class="notice notice-success" role="status" th:text="${thanhCong}"></div>
<div th:if="${loi}" class="notice notice-error" role="alert" th:text="${loi}"></div>
<form method="post" th:action="${editingId != null} ? @{/dean/councils/{id}/edit(id=${editingId})} : @{/dean/councils}" th:object="${form}" class="panel panel-body space-bottom-lg">
  <h2 class="item-title" th:text="${editingId != null ? 'Sửa hội đồng đang lập' : 'Lập hội đồng 3–5 giảng viên'}"></h2>
  <div class="space-bottom">
    <label class="field-label" for="period">Đợt</label>
    <select class="select-field" id="period" th:field="*{period}" required>
      <option value="">Chọn…</option>
      <option th:each="o : ${periods}" th:if="${editingId == null || o.id == form.period}" th:value="${o.id}" th:text="${o.label}"></option>
    </select>
    <div class="error-text caption" th:errors="*{period}"></div>
  </div>
  <div class="space-bottom">
    <label class="field-label" for="chair">Chủ tịch</label>
    <select class="select-field" id="chair" th:field="*{chair}" required>
      <option value="">Chọn…</option>
      <option th:each="o : ${teachers}" th:value="${o.id}" th:text="${o.label}"></option>
    </select>
    <div class="error-text caption" th:errors="*{chair}"></div>
  </div>
  <div class="space-bottom">
    <label class="field-label" for="secretary">Thư ký</label>
    <select class="select-field" id="secretary" th:field="*{secretary}" required>
      <option value="">Chọn…</option>
      <option th:each="o : ${teachers}" th:value="${o.id}" th:text="${o.label}"></option>
    </select>
    <div class="error-text caption" th:errors="*{secretary}"></div>
  </div>
  <div class="space-bottom">
    <label class="field-label" for="members">Thêm 1–3 thành viên khác (giữ Ctrl để chọn nhiều)</label>
    <select class="select-field" id="members" th:field="*{members}" required multiple size="5">
      <option th:each="o : ${teachers}" th:value="${o.id}" th:text="${o.label}"></option>
    </select>
    <div class="error-text caption" th:errors="*{members}"></div>
  </div>
  <div class="inline-fields gap-sm">
    <button class="button button-primary self-start" type="submit" th:text="${editingId != null ? 'Lưu thay đổi' : 'Lưu'}">Lưu</button>
    <a th:if="${editingId != null}" class="button button-outline" th:href="@{/dean/councils}">Hủy sửa</a>
  </div>
</form>
<p class="muted" th:if="${#lists.isEmpty(councils)}">Chưa có hội đồng.</p>
<article th:each="h : ${councils}" class="panel panel-body space-bottom">
  <div class="inline-fields spread">
    <h2 class="item-title" th:text="${h.id + ' — ' + h.period}"></h2>
    <span class="tag self-start"
          th:classappend="${h.state == 'DaChot'} ? 'tag-success' : 'tag-warning'"
          th:text="${h.state == 'DaChot' ? 'Đã chốt' : 'Đang lập (Nháp)'}">
    </span>
  </div>
  <ul class="record-list space-bottom">
    <li class="record-item inline-fields spread" th:each="m : ${h.members}">
      <strong th:text="${m.name + ' (' + m.id + ')'}"></strong>
      <span class="tag"
            th:classappend="${m.role == 'ChuTich'} ? 'tag-info' : 'tag-neutral'"
            th:text="${m.role == 'ChuTich' ? 'Chủ tịch hội đồng' : (m.role == 'ThuKy' ? 'Thư ký hội đồng' : 'Ủy viên')}">
      </span>
    </li>
  </ul>
  <div th:if="${h.state == 'DangLap' && #lists.isEmpty(h.topics)}" class="inline-fields gap-sm space-bottom">
    <a class="button button-outline button-small" th:href="@{/dean/councils/{id}/edit(id=${h.id})}">Sửa thành viên</a>
    <form method="post" th:action="@{/dean/councils/{id}/delete(id=${h.id})}" data-confirm="Xóa hội đồng đang lập này?">
      <button class="button button-danger button-small" type="submit">Xóa hội đồng nháp</button>
    </form>
  </div>
  <form th:if="${h.state == 'DangLap'}" method="post" th:action="@{/dean/councils/{id}/finalize(id=${h.id})}">
    <button class="button button-primary" type="submit">Chốt và khóa thành viên</button>
  </form>
  <div th:unless="${#lists.isEmpty(h.topics)}" class="space-top">
    <p class="field-label">Đề tài được phân công:</p>
    <ul class="space-top-sm">
      <li th:each="t : ${h.topics}" th:text="${t}"></li>
    </ul>
  </div>
</article>
</main>
</body>
</html>
