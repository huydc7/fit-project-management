<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
<title>Đổi mật khẩu</title>
</head>
<body>
<main>
<h1 class="page-title space-bottom">Đổi mật khẩu</h1>
<div th:if="${thanhCong}" class="notice notice-success" role="status" th:text="${thanhCong}">
</div>
<div th:if="${loi}" class="notice notice-error" role="alert" th:text="${loi}">
</div>
<form method="post" th:action="@{/accounts/password}" th:object="${form}" class="panel panel-body space-bottom-lg">
<label class="field-label" for="currentPassword">Mật khẩu hiện tại</label>
<input id="currentPassword" name="currentPassword" type="password" required maxlength="64" autocomplete="current-password" class="field space-bottom">
<div class="error-text caption" th:errors="*{currentPassword}">
</div>
<label class="field-label" for="newPassword">Mật khẩu mới (12–64 ký tự)</label>
<input id="newPassword" name="newPassword" type="password" required maxlength="64" autocomplete="new-password" class="field space-bottom">
<div class="error-text caption" th:errors="*{newPassword}">
</div>
<label class="field-label" for="confirmation">Xác nhận mật khẩu mới</label>
<input id="confirmation" name="confirmation" type="password" required maxlength="64" autocomplete="new-password" class="field space-bottom">
<div class="error-text caption" th:errors="*{confirmation}">
</div>
<p class="muted">Sau khi đổi, bạn cần đăng nhập lại; các phiên cũ hết hiệu lực.</p>
<button class="button button-primary self-start" type="submit">Lưu</button>
</form>
</main>
</body>
</html>
