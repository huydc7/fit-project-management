<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
<title>Đề xuất đề tài</title>
</head>
<body>
<main>
<div class="topic-page-heading"><div><h1 class="page-title">Đề xuất đề tài</h1><p class="muted">Nhập thông tin để gửi đề xuất mới. Xem và chỉnh sửa đề tài tại mục Quản lý đề tài.</p></div><a class="button button-outline" th:href="${topicManagementPath}">Quản lý đề tài</a></div>
<div th:if="${thanhCong}" class="notice notice-success" role="status" th:text="${thanhCong}"></div>
<div th:if="${loi}" class="notice notice-error" role="alert" th:text="${loi}"></div>
<form method="post" th:action="@{/lecturer/topics}" th:object="${form}" class="panel panel-body space-bottom-lg">
  <h2 class="item-title">Đề xuất đề tài mới</h2>
  <div class="space-bottom">
    <label class="field-label" for="period">Đợt đăng ký</label>
    <select class="select-field" id="period" th:field="*{period}" required>
      <option value="">Chọn…</option>
      <option th:each="o : ${periods}" th:value="${o.id}" th:text="${o.label}"></option>
    </select>
    <div class="error-text caption" th:errors="*{period}"></div>
  </div>
  <div class="space-bottom">
    <label class="field-label" for="title">Tên đề tài</label>
    <input type="text" class="field" id="title" th:field="*{title}" required maxlength="300" placeholder="Nhập tên đề tài rõ ràng, cụ thể">
    <div class="error-text caption" th:errors="*{title}"></div>
  </div>
  <div class="space-bottom">
    <label class="field-label" for="content">Nội dung / yêu cầu</label>
    <textarea class="field" id="content" th:field="*{content}" required maxlength="20000" rows="4" placeholder="Mô tả mục tiêu, phạm vi và yêu cầu đạt được của đề tài"></textarea>
    <div class="error-text caption" th:errors="*{content}"></div>
  </div>
  <div class="space-bottom">
    <label class="field-label" for="department">Bộ môn</label>
    <p class="muted">Chọn bộ môn phụ trách chuyên môn của đề tài.</p>
    <select class="select-field" id="department" th:field="*{department}" required>
      <option value="">Chọn…</option>
      <option th:each="o : ${departments}" th:value="${o.id}" th:text="${o.label}"></option>
    </select>
    <div class="error-text caption" th:errors="*{department}"></div>
  </div>
  <button class="button button-primary self-start" type="submit">Lưu</button>
</form>
</main>
</body>
</html>
