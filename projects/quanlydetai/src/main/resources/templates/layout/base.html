<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(()=>{try{const t=localStorage.getItem('fit-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/hcmute-favicon.png(v=20261002c)}">
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico(v=20261002c)}">
<meta name="theme-color" content="#123e63">
<title th:replace="${title}">Quản lý đề tài | FIT HCMUTE</title>
<link rel="stylesheet" th:href="@{/css/custom.css(v=20261026-notice-search)}">
<script defer th:src="@{/js/app.js(v=20261026-topic-dialog)}">
</script>
</head>
<body class="app-page">
<a class="skip-link" href="#main-content">Đến nội dung chính</a>
<div class="app-shell">
<aside th:replace="~{layout/fragments :: sidebar}">
</aside>
<button class="menu-backdrop" type="button" data-menu-close aria-label="Đóng menu" hidden>
</button>
<div class="workspace">
<header th:replace="~{layout/fragments :: topbar}">
</header>
<div class="page-content" id="main-content" tabindex="-1">
<th:block th:replace="${content}">
</th:block>
</div>
<footer class="app-footer">
<span>FIT · HCMUTE</span>
<span>Hệ thống quản lý đề tài sinh viên</span>
</footer>
</div>
</div>
</body>
</html>
