spring.application.name=quanlydetai
spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.hikari.maximum-pool-size=5
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Delivery is optional/asynchronous and may use HTTPS, not SMTP. Queue status is
# monitored separately; an unavailable SMTP preview must not take the website down.
management.health.mail.enabled=false
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:bao-cao-de-tai}
app.storage.backend=${STORAGE_BACKEND:local}
app.storage.local-path=${LOCAL_STORAGE_PATH:./uploads}

# Publication persists notifications even when delivery is disabled.
app.public-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.email.enabled=${EMAIL_ENABLED:false}
app.email.backend=${EMAIL_BACKEND:smtp}
app.email.from=${EMAIL_FROM:}
app.email.api-key=${EMAIL_API_KEY:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
