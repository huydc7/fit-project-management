spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD}
spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET}
app.storage.backend=${STORAGE_BACKEND:supabase}

spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'
